<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>جزئیات گوشی | موبایل پیام</title>
  <meta name="description" content="مشخصات و گالری عکس واقعی گوشی در موبایل پیام نهاوند">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
  <style>
    .pd{padding:28px 0 90px}
    .pd-grid{display:grid;grid-template-columns:1.05fr 1.15fr;gap:28px}
    @media(max-width:900px){.pd-grid{grid-template-columns:1fr}}
    .pd-gallery{
      background:linear-gradient(180deg,#0b1220,#080c14);
      border:1px solid #24344f;border-radius:22px;min-height:420px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:28px 20px 18px;position:relative;overflow:hidden;
    }
    .pd-gallery::before{
      content:"";position:absolute;left:15%;right:15%;bottom:18%;height:28px;
      background:radial-gradient(ellipse at center,rgba(0,0,0,.5),transparent 70%);
      filter:blur(8px);pointer-events:none;
    }
    .pd-gallery #mainPhoto{
      max-width:72%;max-height:340px;object-fit:contain;cursor:zoom-in;
      filter:drop-shadow(0 22px 36px rgba(0,0,0,.8));position:relative;z-index:1;
      transition:transform .3s ease;
    }
    .pd-gallery #mainPhoto:hover{transform:scale(1.03)}
    .pd-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px;position:relative;z-index:2}
    .pd-thumbs button{border:2px solid transparent;background:#0f172a;border-radius:12px;padding:5px;cursor:pointer;transition:.2s}
    .pd-thumbs button.active,.pd-thumbs button:hover{border-color:#22d3ee;transform:translateY(-2px)}
    .pd-thumbs img{width:56px;height:56px;object-fit:contain}
    .zoom-hint{position:absolute;top:14px;left:14px;font-size:11px;color:#94a3b8;background:rgba(15,23,42,.8);padding:6px 10px;border-radius:8px;border:1px solid #24344f}
    .pd-brand{color:#22d3ee;font-size:12px;margin-bottom:6px;letter-spacing:.06em}
    .pd h1{font-size:clamp(22px,3.5vw,32px);margin:0 0 6px}
    .pd-fa{color:#9aa8c0;margin-bottom:16px}
    .pd-price{font-size:22px;color:#67e8f9;font-weight:800;margin:12px 0 18px}
    .pd-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
    .pd-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
    .pd-specs .spec{background:#151f33;border:1px solid #24344f;border-radius:12px;padding:12px}
    .pd-specs .spec span{display:block;color:#9aa8c0;font-size:12px;margin-bottom:4px}
    .pd-desc{line-height:1.9;color:#c5d0e2;background:#121a28;border:1px solid #24344f;border-radius:16px;padding:16px 18px}
    .crumb{color:#9aa8c0;font-size:13px;margin-bottom:16px}.crumb a{color:#67e8f9;text-decoration:none}
    .notfound{text-align:center;padding:60px 20px}
  </style>
</head>
<body>
  <div class="topbar"><div class="container topbar-inner">
    <span>📍 نهاوند، روبروی بانک ملت مرکزی</span>
    <a href="tel:09127144988">📞 ۰۹۱۲۷۱۴۴۹۸۸</a>
  </div></div>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="./"><span class="logo-mark">پ</span><span class="logo-text">موبایل <b>پیام</b><small>نهاوند</small></span></a>
      <nav class="nav" id="nav">
        <a href="./">خانه</a>
        <a href="products.html" class="active">گوشی‌ها</a>
        <a href="brands.html">برندها</a>
        <a href="about.html">درباره ما</a>
        <a href="contact.html">تماس</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-call" href="tel:09127144988">تماس</a>
        <button class="menu-btn" id="menuBtn" aria-label="منو"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main class="container pd" id="main"><div class="notfound">در حال بارگذاری...</div></main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lbClose" type="button" aria-label="بستن">×</button>
    <button class="lightbox-nav prev" id="lbPrev" type="button" aria-label="قبلی">‹</button>
    <button class="lightbox-nav next" id="lbNext" type="button" aria-label="بعدی">›</button>
    <img class="lightbox-main" id="lbMain" alt="">
    <div class="lightbox-thumbs" id="lbThumbs"></div>
    <div class="lightbox-counter" id="lbCounter"></div>
  </div>

  <div class="sticky-cta">
    <a href="tel:09127144988">تماس</a>
    <a href="https://wa.me/989127144988" target="_blank" rel="noopener">واتساپ</a>
  </div>
  <footer class="footer"><div class="container footer-bottom"><span>© موبایل پیام</span><a href="products.html">بازگشت</a></div></footer>

  <script src="js/p1.js"></script>
  <script src="js/p1b.js"></script>
  <script src="js/p2.js"></script>
  <script src="js/p3.js"></script>
  <script src="js/p4.js"></script>
  <script src="js/img-fix.js"></script>
  <script>
    document.querySelector("#menuBtn")?.addEventListener("click", function () {
      document.querySelector("#nav")?.classList.toggle("open");
    });
    if (window.payamFixProducts) window.payamFixProducts();

    var id = new URLSearchParams(location.search).get("id");
    var products = window.PAYAM_PRODUCTS || [];
    var p = products.find(function (x) { return x.id === id; });
    var main = document.querySelector("#main");
    var photoList = [];
    var photoIndex = 0;

    function fa(n) {
      return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[+d]; });
    }

    function openLightbox(i) {
      photoIndex = i || 0;
      var lb = document.getElementById("lightbox");
      lb.hidden = false;
      document.body.style.overflow = "hidden";
      showLb();
    }
    function closeLightbox() {
      document.getElementById("lightbox").hidden = true;
      document.body.style.overflow = "";
    }
    function showLb() {
      if (!photoList.length) return;
      photoIndex = (photoIndex + photoList.length) % photoList.length;
      document.getElementById("lbMain").src = photoList[photoIndex];
      document.getElementById("lbCounter").textContent = fa(photoIndex + 1) + " / " + fa(photoList.length);
      var thumbs = document.getElementById("lbThumbs");
      thumbs.innerHTML = photoList.map(function (u, i) {
        return '<button type="button" class="' + (i === photoIndex ? "active" : "") + '" data-i="' + i + '"><img src="' + u + '" alt=""></button>';
      }).join("");
    }

    document.getElementById("lbClose").onclick = closeLightbox;
    document.getElementById("lbPrev").onclick = function () { photoIndex--; showLb(); };
    document.getElementById("lbNext").onclick = function () { photoIndex++; showLb(); };
    document.getElementById("lbThumbs").onclick = function (e) {
      var btn = e.target.closest("button[data-i]");
      if (!btn) return;
      photoIndex = +btn.dataset.i;
      showLb();
    };
    document.getElementById("lightbox").addEventListener("click", function (e) {
      if (e.target.id === "lightbox") closeLightbox();
    });
    document.addEventListener("keydown", function (e) {
      var lb = document.getElementById("lightbox");
      if (lb.hidden) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") { photoIndex++; showLb(); }
      if (e.key === "ArrowRight") { photoIndex--; showLb(); }
    });

    if (!p) {
      main.innerHTML = '<div class="notfound"><h1>محصول پیدا نشد</h1><a class="btn btn-primary" href="products.html">بازگشت</a></div>';
    } else {
      if (!p.desc) {
        p.desc = (p.nameFa || p.name) + " از برند " + p.brand + " با پردازنده " + p.chip +
          "، رم " + p.ram + " و حافظه " + p.storage + ". صفحه " + p.screen +
          "، دوربین " + p.camera + " مگاپیکسل، باتری " + p.battery +
          " میلی‌آمپر و سیستم‌عامل " + p.os + ". برای قیمت روز با موبایل پیام تماس بگیرید.";
      }
      document.title = p.name + " | موبایل پیام";
      main.innerHTML =
        '<div class="crumb"><a href="./">خانه</a> / <a href="products.html">گوشی‌ها</a> / ' + p.name + '</div>' +
        '<div class="pd-grid">' +
          '<div class="pd-gallery">' +
            '<span class="zoom-hint">برای بزرگ‌نمایی کلیک کنید</span>' +
            '<img id="mainPhoto" src="' + p.img + '" alt="' + p.name + '">' +
            '<div class="pd-thumbs" id="thumbs"></div>' +
          '</div>' +
          '<div>' +
            '<div class="pd-brand">' + (p.brand || "").toUpperCase() + '</div>' +
            '<h1>' + p.name + '</h1>' +
            '<div class="pd-fa">' + (p.nameFa || "") + '</div>' +
            '<div class="pd-price">قیمت روز: تماس بگیرید</div>' +
            '<div class="pd-actions">' +
              '<a class="btn btn-primary" href="tel:09127144988">تماس ۰۹۱۲۷۱۴۴۹۸۸</a>' +
              '<a class="btn btn-outline" href="https://wa.me/989127144988?text=' + encodeURIComponent("سلام، درباره " + p.name + " سوال داشتم") + '" target="_blank" rel="noopener">واتساپ</a>' +
            '</div>' +
            '<div class="pd-specs">' +
              '<div class="spec"><span>پردازنده</span><b>' + p.chip + '</b></div>' +
              '<div class="spec"><span>رم</span><b>' + p.ram + '</b></div>' +
              '<div class="spec"><span>حافظه</span><b>' + p.storage + '</b></div>' +
              '<div class="spec"><span>صفحه</span><b>' + p.screen + '</b></div>' +
              '<div class="spec"><span>دوربین</span><b>' + p.camera + ' مگاپیکسل</b></div>' +
              '<div class="spec"><span>باتری</span><b>' + p.battery + ' میلی‌آمپر</b></div>' +
              '<div class="spec"><span>سیستم‌عامل</span><b>' + p.os + '</b></div>' +
              '<div class="spec"><span>موجودی</span><b>استعلام تلفنی</b></div>' +
            '</div>' +
            '<div class="pd-desc">' + p.desc + '</div>' +
          '</div>' +
        '</div>';

      var candidates = window.payamGallery ? window.payamGallery(p) : [p.img];
      var mainPhoto = document.getElementById("mainPhoto");
      var thumbs = document.getElementById("thumbs");
      var valid = [];
      var left = candidates.length;

      function finish() {
        valid.sort(function (a, b) { return a.idx - b.idx; });
        photoList = valid.length ? valid.map(function (v) { return v.u; }) : [p.img];
        mainPhoto.src = photoList[0];
        thumbs.innerHTML = photoList.map(function (u, i) {
          return '<button type="button" class="' + (i === 0 ? "active" : "") + '" data-i="' + i + '"><img src="' + u + '" alt=""></button>';
        }).join("");
        thumbs.onclick = function (e) {
          var btn = e.target.closest("button[data-i]");
          if (!btn) return;
          var i = +btn.dataset.i;
          mainPhoto.src = photoList[i];
          thumbs.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
        };
        mainPhoto.onclick = function () { openLightbox(0); };
        thumbs.addEventListener("dblclick", function () { openLightbox(0); });
      }

      candidates.forEach(function (u, idx) {
        var im = new Image();
        im.onload = function () { valid.push({ u: u, idx: idx }); left--; if (!left) finish(); };
        im.onerror = function () { left--; if (!left) finish(); };
        im.src = u;
      });
    }
  </script>
</body>
</html>

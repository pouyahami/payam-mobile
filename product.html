<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>جزئیات گوشی | موبایل پیام</title>
  <meta name="description" content="مشخصات کامل گوشی در موبایل پیام نهاوند. تماس: ۰۹۱۲۷۱۴۴۹۸۸">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
  <style>
    .pd{padding:28px 0 90px}.pd-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:28px}
    @media(max-width:900px){.pd-grid{grid-template-columns:1fr}}
    .pd-gallery{background:#080c14;background-image:radial-gradient(ellipse at 50% 60%,#1a2740,#080c14 70%);border:1px solid #24344f;border-radius:20px;min-height:360px;display:grid;place-items:center;padding:24px}
    .pd-gallery img{max-width:70%;max-height:340px;object-fit:contain;filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
    .pd-brand{color:#22d3ee;font-size:12px;margin-bottom:6px}.pd h1{font-size:clamp(22px,3.5vw,32px);margin:0 0 6px}
    .pd-fa{color:#9aa8c0;margin-bottom:16px}.pd-price{font-size:22px;color:#67e8f9;font-weight:800;margin:12px 0 18px}
    .pd-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
    .pd-specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
    .pd-specs .spec{background:#151f33;border:1px solid #24344f;border-radius:12px;padding:12px}
    .pd-specs .spec span{display:block;color:#9aa8c0;font-size:12px;margin-bottom:4px}
    .pd-desc{line-height:1.9;color:#c5d0e2;background:#121a28;border:1px solid #24344f;border-radius:16px;padding:16px 18px}
    .pd-related{margin-top:36px}.crumb{color:#9aa8c0;font-size:13px;margin-bottom:16px}.crumb a{color:#67e8f9;text-decoration:none}
    .notfound{text-align:center;padding:60px 20px}
  </style>
</head>
<body>
  <div class="topbar"><div class="container topbar-inner">
    <span>📍 نهاوند، روبروی بانک ملت مرکزی</span>
    <a href="tel:09127144988">📞 ۰۹۱۲۷۱۴۴۹۸۸</a>
  </div></div>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="./"><span class="logo-mark">پ</span><span class="logo-text">موبایل <b>پیام</b><small>نهاوند</small></span></a>
      <nav class="nav" id="nav">
        <a href="./">خانه</a>
        <a href="products.html" class="active">گوشی‌ها</a>
        <a href="brands.html">برندها</a>
        <a href="about.html">درباره ما</a>
        <a href="contact.html">تماس</a>
      </nav>
      <div class="header-actions">
        <a class="btn btn-call" href="tel:09127144988">تماس</a>
        <button class="menu-btn" id="menuBtn" aria-label="منو"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>
  <main class="container pd" id="main"><div class="notfound" id="loading">در حال بارگذاری...</div></main>
  <div class="sticky-cta">
    <a href="tel:09127144988">تماس</a>
    <a href="https://wa.me/989127144988" target="_blank" rel="noopener">واتساپ</a>
  </div>
  <footer class="footer"><div class="container footer-bottom"><span>© موبایل پیام</span><a href="products.html">بازگشت به فهرست</a></div></footer>
  <script src="js/p1.js"></script>
  <script src="js/p2.js"></script>
  <script src="js/p3.js"></script>
  <script src="js/p4.js"></script>
  <script>
    document.querySelector("#menuBtn")?.addEventListener("click", () => document.querySelector("#nav")?.classList.toggle("open"));
    const id = new URLSearchParams(location.search).get("id");
    const products = window.PAYAM_PRODUCTS || [];
    const p = products.find(x => x.id === id);
    const main = document.querySelector("#main");
    if (!p) {
      main.innerHTML = `<div class="notfound"><h1>محصول پیدا نشد</h1><a class="btn btn-primary" href="products.html">بازگشت</a></div>`;
    } else {
      if (!p.desc) p.desc = `${p.nameFa||p.name} از برند ${p.brand} با پردازنده ${p.chip}، رم ${p.ram} و حافظه ${p.storage}. صفحه ${p.screen}، دوربین ${p.camera} مگاپیکسل، باتری ${p.battery} میلی‌آمپر و سیستم‌عامل ${p.os}. برای قیمت روز با موبایل پیام تماس بگیرید.`;
      document.title = p.name + " | موبایل پیام";
      const related = products.filter(x => x.brand === p.brand && x.id !== p.id).slice(0, 4);
      main.innerHTML = `
        <div class="crumb"><a href="./">خانه</a> / <a href="products.html">گوشی‌ها</a> / ${p.name}</div>
        <div class="pd-grid">
          <div class="pd-gallery"><img src="${p.img}" alt="${p.name}" onerror="this.style.opacity=.25"></div>
          <div>
            <div class="pd-brand">${(p.brand||"").toUpperCase()}</div>
            <h1>${p.name}</h1>
            <div class="pd-fa">${p.nameFa||""}</div>
            <div class="pd-price">قیمت روز: تماس بگیرید</div>
            <div class="pd-actions">
              <a class="btn btn-primary" href="tel:09127144988">تماس ۰۹۱۲۷۱۴۴۹۸۸</a>
              <a class="btn btn-outline" href="https://wa.me/989127144988?text=${encodeURIComponent("سلام، درباره "+p.name+" سوال داشتم")}" target="_blank" rel="noopener">واتساپ</a>
            </div>
            <div class="pd-specs">
              <div class="spec"><span>پردازنده</span><b>${p.chip}</b></div>
              <div class="spec"><span>رم</span><b>${p.ram}</b></div>
              <div class="spec"><span>حافظه</span><b>${p.storage}</b></div>
              <div class="spec"><span>صفحه</span><b>${p.screen}</b></div>
              <div class="spec"><span>دوربین</span><b>${p.camera} مگاپیکسل</b></div>
              <div class="spec"><span>باتری</span><b>${p.battery} میلی‌آمپر</b></div>
              <div class="spec"><span>سیستم‌عامل</span><b>${p.os}</b></div>
              <div class="spec"><span>موجودی</span><b>استعلام تلفنی</b></div>
            </div>
            <div class="pd-desc">${p.desc}</div>
          </div>
        </div>
        ${related.length ? `<div class="pd-related"><h2>مدل‌های مشابه</h2><div class="product-grid">${related.map(r => `
          <a class="card" href="product.html?id=${r.id}" style="text-decoration:none;color:inherit">
            <div class="card-img"><img src="${r.img}" alt="${r.name}" loading="lazy" onerror="this.style.opacity=.2"></div>
            <div class="card-body"><div class="card-brand">${(r.brand||"").toUpperCase()}</div><h3>${r.name}</h3>
            <p class="card-spec">${r.ram} · ${r.storage}</p></div></a>`).join("")}</div></div>` : ""}`;
    }
  </script>
</body>
</html>
